# Builds the production OpenEMR image from this repository's source
# (docker/fork/Dockerfile) and pushes it to GHCR on every push to main.

name: Fork image build

on:
  push:
    branches:
    - main

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-image-build
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'bryanjbelanger/openemr-base-clean'
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Compute build metadata
      id: meta
      run: |
        V_MAJOR=$(awk -F"'" '/^\$v_major[[:space:]]*=/ {print $2}' version.php)
        V_MINOR=$(awk -F"'" '/^\$v_minor[[:space:]]*=/ {print $2}' version.php)
        V_PATCH=$(awk -F"'" '/^\$v_patch[[:space:]]*=/ {print $2}' version.php)
        V_TAG=$(awk -F"'" '/^\$v_tag[[:space:]]*=/ {print $2}' version.php)
        V_REALPATCH=$(awk -F"'" '/^\$v_realpatch[[:space:]]*=/ {print $2}' version.php)
        VERSION="${V_MAJOR}.${V_MINOR}.${V_PATCH}"
        if [ -n "$V_TAG" ]; then
          VERSION="${VERSION}${V_TAG}"
        elif [ "$V_REALPATCH" != "0" ]; then
          VERSION="${VERSION}.${V_REALPATCH}"
        fi
        {
          echo "version=$VERSION"
          echo "date=$(date +'%Y-%m-%d')"
          echo "short_sha=${GITHUB_SHA::7}"
        } >> "$GITHUB_OUTPUT"

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        file: docker/fork/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ghcr.io/bryanjbelanger/openemr-base-clean:main
          ghcr.io/bryanjbelanger/openemr-base-clean:sha-${{ steps.meta.outputs.short_sha }}
        build-args: |
          VCS_REF=${{ github.sha }}
          IMAGE_VERSION=${{ steps.meta.outputs.version }}
          BUILD_DATE=${{ steps.meta.outputs.date }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
