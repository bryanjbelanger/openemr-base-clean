name: agent-pr-checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  fast-checks:
    runs-on: [self-hosted, macOS, openemr-agent]
    timeout-minutes: 60
    concurrency:
      group: agent-pr-checks-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Reject pull requests from other repositories
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then echo "Pull requests from other repositories are not checked."; exit 1; fi
      - uses: actions/checkout@v7
        with:
          clean: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Install JS dependencies
        run: npm ci
      - name: PHP syntax
        run: composer php-syntax-check
      - name: PHP code style
        run: |
          mkdir -p "$HOME/.cache/openemr-phpcs"
          composer phpcs -- --cache="$HOME/.cache/openemr-phpcs/$RUNNER_NAME.json"
      - name: PHPStan
        run: composer phpstan
      - name: PHP isolated unit tests
        run: composer phpunit-isolated
      - name: JS lint
        run: npm run lint:js
      - name: JS tests
        run: npm run test:js
      - name: Notify on failure
        if: failure() && github.event.pull_request.head.repo.full_name == github.repository
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -f agent-pipeline/notify.sh ]; then bash agent-pipeline/notify.sh "Checks failed" "PR #$PR_NUMBER: $PR_TITLE" "$PR_URL"; fi
